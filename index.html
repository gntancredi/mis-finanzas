<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Mi Centro Financiero</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Finanzas">
<style>
:root{
  --bg:#e9f0f8; --surface:#ffffff; --surface-2:#f2f6fb; --border:#d5e0ec; --text:#17202b; --muted:#5d6b7c;
  --primary:#2f6db5; --primary-2:#2f6db5; --primary-soft:#e3edf8; --on-primary:#ffffff; --navy:#1f4e79; --accent:#f2a900; --confirm:#2e7d32;
  --ok:#2e7d32; --ok-soft:#e5f3e6; --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fff4dd; --info:#2d6aa3; --info-soft:#e6eef7;
  --c1:#2d6aa3; --c2:#147a4b; --c3:#c2410c; --c4:#7c3aed; --c5:#0e7490; --c6:#a16207; --c7:#be185d; --c8:#4d7c0f;
  --radius:14px; --radius-sm:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --nav-h:64px; --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e27; --surface-2:#1d2631; --border:#2a3542; --text:#e8edf3; --muted:#9aa8b8;
  --primary:#5b9bd5; --primary-2:#7fb2e0; --primary-soft:#1d2d40; --on-primary:#0b1622; --navy:#1b3550; --accent:#f2b72a; --confirm:#4cc38a;
  --ok:#4cc38a; --ok-soft:#14301f; --bad:#f2766b; --bad-soft:#3a1a17; --warn:#f0b451; --warn-soft:#382a12; --info:#7fb2e0; --info-soft:#1d2d40;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e27; --surface-2:#1d2631; --border:#2a3542; --text:#e8edf3; --muted:#9aa8b8;
  --primary:#5b9bd5; --primary-2:#7fb2e0; --primary-soft:#1d2d40; --on-primary:#0b1622; --navy:#1b3550; --accent:#f2b72a; --confirm:#4cc38a;
  --ok:#4cc38a; --ok-soft:#14301f; --bad:#f2766b; --bad-soft:#3a1a17; --warn:#f0b451; --warn-soft:#382a12; --info:#7fb2e0; --info-soft:#1d2d40;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Layout ---------- */
.app{min-height:100vh;display:flex}
.sidebar{display:none}
.main{flex:1;min-width:0;padding:0 16px calc(var(--nav-h) + 96px)}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;margin-bottom:6px}
.topbar-card{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;box-shadow:var(--shadow)}
.sun{width:36px;height:36px;flex-shrink:0;border-radius:9px;overflow:hidden;display:block}
.sun img{width:100%;height:100%;display:block}
.topbar h1{font-size:17px;margin:0;flex:1;min-width:0;letter-spacing:-.01em;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-theme="dark"] .topbar h1,:root[data-theme="dark"] .brand,:root[data-theme="dark"] .gate h1{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .topbar h1,:root:not([data-theme="light"]) .brand,:root:not([data-theme="light"]) .gate h1{color:var(--text)}}
.topbar .sub{color:var(--muted);font-size:12px;display:block;font-weight:400}
.status-pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap;cursor:pointer}
.status-pill.pend{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.status-pill.err{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr)}
.bottomnav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;min-height:48px}
.bottomnav button.active{color:var(--primary);font-weight:600}
.bottomnav svg,.sidebar svg{width:22px;height:22px}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:31;background:var(--primary);color:var(--on-primary);border:0;border-radius:99px;padding:0 20px;height:54px;font-weight:700;font-size:15px;box-shadow:0 6px 16px rgba(31,78,121,.35);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab:active{transform:scale(.97)}
@media (min-width:960px){
  .bottomnav{display:none}
  .sidebar{display:flex;flex-direction:column;width:232px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:18px 12px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13.5px;letter-spacing:.02em;padding:4px 6px 18px;color:var(--navy)}
  .sidebar nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;border-radius:10px;color:var(--text);cursor:pointer;font-size:14px;text-align:left}
  .sidebar nav button:hover{background:var(--surface-2)}
  .sidebar nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .sidebar .side-cta{margin:4px 0 16px;width:100%;justify-content:center;border-radius:10px;height:46px;position:static;box-shadow:none}
  .main{padding:0 28px 48px;max-width:1280px}
  .fab.mobile-only{display:none}
}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card h2,.section-title{font-size:15px;margin:0 0 12px;font-weight:700;color:var(--navy)}
.section-title{text-transform:uppercase;font-size:12.5px;letter-spacing:.06em}
:root[data-theme="dark"] .card h2,:root[data-theme="dark"] .section-title{color:var(--primary-2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h2,:root:not([data-theme="light"]) .section-title{color:var(--primary-2)}}
.install-btn{border:1px solid var(--border);background:var(--surface);color:var(--navy);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 10px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.two{grid-template-columns:1fr}
@media (min-width:960px){.two{grid-template-columns:1fr 1fr}}
.kpi{padding:14px}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.kpi .val{font-size:20px;font-weight:750;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;word-break:break-word}
.kpi .hint{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.main-kpi{grid-column:1/-1;background:var(--navy);color:#ffffff;border:0}
.kpi.main-kpi .lbl,.kpi.main-kpi .hint{color:inherit;opacity:.85}
.kpi.main-kpi .val{font-size:28px}
@media (min-width:1100px){.kpi.main-kpi{grid-column:span 2}}
.pos{color:var(--ok)} .neg{color:var(--bad)} .muted{color:var(--muted)} .small{font-size:12.5px}
.info-dot{display:inline-flex;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;font-size:10px;align-items:center;justify-content:center;opacity:.7;cursor:help;background:none;padding:0;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:0 14px;min-height:42px;cursor:pointer;font-weight:600;font-size:14px;color:var(--text);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.confirm{background:var(--confirm);border-color:var(--confirm);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;min-height:36px}
.chip.active{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.info{background:var(--info-soft);color:var(--info)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:6px}
.alert.error{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.info{background:var(--info-soft);color:var(--info)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty h3{color:var(--text);margin:8px 0 6px;font-size:17px}
.empty ol{text-align:left;display:inline-block;margin:10px 0 16px;padding-left:20px;line-height:1.9}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--border)}
.progress>i{display:block;height:100%;background:var(--primary-2);border-radius:99px}
.progress.warn>i{background:var(--warn)} .progress.bad>i{background:var(--bad)} .progress.ok>i{background:var(--ok)}

/* Listas tipo tarjeta (móvil) / tabla (PC) */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;cursor:pointer;text-align:left;width:100%}
.item:hover{border-color:var(--primary-2)}
.item .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;font-size:15px}
.item .body{flex:1;min-width:0;display:block}
.item .t1,.item .t2{display:block}
.item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.item.anulado{opacity:.55}
.item.anulado .amt{text-decoration:line-through}
.ic.INGRESO,.ic.DEVOLUCION{background:var(--ok-soft);color:var(--ok)} .ic.GASTO{background:var(--bad-soft);color:var(--bad)}
.ic.TRANSFERENCIA,.ic.PAGO_TARJETA,.ic.AJUSTE{background:var(--info-soft);color:var(--info)} .ic.AHORRO,.ic.INVERSION{background:var(--warn-soft);color:var(--warn)} .ic.PAGO_DEUDA{background:var(--surface-2);color:var(--muted)}
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}

/* Filtros */
.filters{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:10px 0}
.filters>*{min-width:0}
@media (min-width:960px){.filters{grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr))}}
.filters .search{grid-column:1/-1}
@media (min-width:960px){.filters .search{grid-column:auto}}
.totals{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin:6px 0 12px;color:var(--muted)}
.totals b{color:var(--text);font-variant-numeric:tabular-nums}

/* Formularios */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.filters input,.filters select{width:100%;min-height:46px;border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.filters input:focus,.filters select:focus{outline:2px solid var(--primary-2);outline-offset:0;border-color:transparent}
.field .help{font-size:12px;color:var(--muted)}
.field.amount input{font-size:28px;font-weight:750;text-align:center;min-height:62px;font-variant-numeric:tabular-nums}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.fgrid>*{min-width:0}
.fgrid .full{grid-column:1/-1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.seg button{border:1px solid var(--border);background:var(--surface);border-radius:10px;min-height:44px;font-size:13px;font-weight:600;cursor:pointer;padding:4px}
.seg button.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.seg.two-col{grid-template-columns:1fr 1fr}
.check{display:flex;align-items:center;gap:10px;margin:4px 0 12px;font-size:14px;cursor:pointer;min-height:40px}
.check input{width:20px;height:20px}
.form-error{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px;margin-bottom:12px}
details.more summary{cursor:pointer;color:var(--primary);font-weight:600;font-size:14px;margin:4px 0 12px;min-height:32px}

/* Modal / hoja inferior */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--border);margin:4px auto 10px}
.sheet header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet header h2{flex:1;font-size:18px;margin:0}
.sheet .close{background:var(--surface-2);border:0;border-radius:50%;width:36px;height:36px;font-size:20px;cursor:pointer;color:var(--muted)}
.sheet .actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 4px;display:flex;gap:8px;border-top:1px solid var(--border);margin-top:4px}
.sheet .actions .btn{flex:1;min-height:50px}
@media (min-width:700px){.overlay{align-items:center}.sheet{max-width:560px;border-radius:18px;max-height:88vh}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.detail dt{color:var(--muted)} .detail dd{margin:0;word-break:break-word}

/* Toast */
.toasts{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 84px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
@media (min-width:960px){.toasts{bottom:24px}}
.toast{background:#17202b;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
.toast.ok{background:#0f5c39} .toast.err{background:#8f1d14} .toast.warn{background:#7a4600}

/* Gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.chart .grid-line{stroke:var(--border);stroke-width:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;gap:8px;align-items:center;font-size:13px;margin-bottom:8px}
.hbar .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px}
.hbar .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:54px;border:1px solid var(--border);border-radius:8px;padding:4px;font-size:12px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column}
.cal .day.out{opacity:.35}
.cal .day.today{border-color:var(--primary);border-width:2px}
.cal .day .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto}
.cal .day .dots i{width:7px;height:7px;border-radius:50%;background:var(--info)}
.cal .day .dots i.VENCIDO{background:var(--bad)} .cal .day .dots i.PROXIMO{background:var(--warn)} .cal .day .dots i.PAGADO{background:var(--ok)}

/* Login / bloqueos */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .card{max-width:420px;width:100%;text-align:center;padding:28px}
.gate h1{font-size:20px;color:var(--navy);margin:12px 0 8px}
.gate .sun{width:84px;height:84px;border-radius:20px;margin:0 auto}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:48px;color:var(--muted)}
.spin{width:18px;height:18px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.update-bar{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--primary);color:var(--on-primary);padding:10px 16px;display:flex;gap:10px;align-items:center;justify-content:center;font-size:14px}
.update-bar button{background:var(--on-primary);color:var(--primary);border:0;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer}

</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span> Cargando…</div></div>
<script src="config.js"></script>
<script>
/* MI CENTRO FINANCIERO — núcleo del frontend (transporte, utilidades, formularios, gráficos) */
'use strict';
var MCF = window.MCF = {};
var CFG = window.MCF_CONFIG || {};
var IS_GAS = !!(window.google && google.script && google.script.run);
var APP = { state: null, view: 'inicio', idToken: null, user: null, loading: false,
  dash: { preset: 'mes', desde: null, hasta: null }, budgetPer: null,
  movFilter: { preset: 'mes', desde: null, hasta: null, tipo: '', cat: '', cuenta: '', medio: '', q: '', sort: 'fecha_desc' },
  venc: { modo: 'lista', mes: null }, informe: { per: null } };
MCF.APP = APP;

/* ---------------- Utilidades ---------------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function esc(v) { return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  if (!CFG.API_URL || /PEGAR/.test(CFG.API_URL)) return Promise.reject(new Error('Falta configurar API_URL en config.js.'));

var QKEY = 'mcf_cola_pendiente_v1';

  list: function () { return lsGet(QKEY, []); },
  save: function (q) { lsSet(QKEY, q); MCF.renderStatus(); },
  add: function (payload) { var q = this.list().filter(function (x) { return x.payload.ID !== payload.ID; }); q.push({ payload: payload, estado: 'PENDIENTE', creado: new Date().toISOString(), error: '' }); return this.save(q); },
  remove: function (id) { this.save(this.list().filter(function (x) { return x.payload.ID !== id; })); },
  sync: function () {
    var q = MCF.queue.list(); if (!q.length || MCF.queue._busy) return Promise.resolve(0);
    MCF.queue._busy = true; var done = 0;
    return q.reduce(function (p, item) {
      return p.then(function () {
        return MCF.api('saveMovimiento', item.payload).then(function () { done++; MCF.queue.remove(item.payload.ID); }, function (err) {
          var cur = MCF.queue.list(); cur.forEach(function (x) { if (x.payload.ID === item.payload.ID) { x.estado = err.network ? 'PENDIENTE' : 'ERROR'; x.error = err.message; } }); MCF.queue.save(cur);
          if (err.network) throw err; // corta: sigue sin conexión

      });
    }, Promise.resolve()).catch(function () {}).then(function () {
      MCF.queue._busy = false;

      return done;
    });
  }

var VIEWS = [['inicio', 'Inicio'], ['movimientos', 'Movimientos'], ['cuentas', 'Cuentas'], ['tarjetas', 'Tarjetas'], ['vencimientos', 'Vencimientos'], ['presupuesto', 'Presupuesto'], ['objetivos', 'Objetivos'], ['inversiones', 'Inversiones'], ['deudas', 'Deudas'], ['informes', 'Informes'], ['ajustes', 'Ajustes']];

/* ================= Arranque ================= */
MCF.start = function () {
  var root = $('#app');
  root.innerHTML = '<div class="app"><aside class="sidebar"><div class="brand"><span class="sun">' + SUN + '</span>MI CENTRO FINANCIERO</div><button class="fab side-cta" data-new>+ Registrar movimiento</button><nav>' +
    VIEWS.map(function (v) { return '<button data-view="' + v[0] + '">' + icon(v[0]) + v[1] + '</button>'; }).join('') + '</nav></aside>' +
    '<main class="main"><div class="topbar"><div class="topbar-card"><span class="sun">' + SUN + '</span><h1 id="title">Inicio</h1><button id="install" class="install-btn hidden" type="button">📲 Instalar</button><button id="status" class="status-pill" type="button">…</button></div></div><div id="view"><div class="loading"><span class="spin"></span> Leyendo Google Sheets…</div></div></main>' +
    '<nav class="bottomnav">' + [['inicio', 'Inicio'], ['movimientos', 'Movim.'], ['vencimientos', 'Venc.'], ['presupuesto', 'Presup.'], ['mas', 'Más']].map(function (v) { return '<button data-view="' + v[0] + '">' + icon(v[0]) + '<span>' + v[1] + '</span></button>'; }).join('') + '</nav>' +
    '<button class="fab mobile-only" data-new aria-label="Registrar movimiento">+ Registrar movimiento</button></div><div id="toasts" class="toasts" aria-live="polite"></div>';
  root.addEventListener('click', function (e) {
    var v = e.target.closest('[data-view]'); if (v) { MCF.go(v.dataset.view); return; }
    if (e.target.closest('[data-new]')) MCF.movForm({});
  });
  var deferred = null, ib = $('#install');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; ib.classList.remove('hidden'); });
  if (MCF._deferredInstall) { deferred = MCF._deferredInstall; ib.classList.remove('hidden'); }
  ib.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; ib.classList.add('hidden'); }); };
  $('#status').onclick = function () { if (MCF.queue.list().length) MCF.showQueue(); else MCF.reload(true); };
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h && h !== APP.view) MCF.go(h, true); });
  var h = location.hash.slice(1); if (VIEWS.some(function (v) { return v[0] === h; })) APP.view = h;
  MCF.renderStatus();
  MCF.reload().then(function () { MCF.queue.sync(); });
};

MCF.go = function (view, fromHash) {
  if (view === 'mas') return MCF.moreMenu();
  MCF.closeSheet();
  APP.view = view; if (!fromHash) history.replaceState(null, '', '#' + view);
  MCF.render(); window.scrollTo(0, 0);
};
MCF.moreMenu = function () {
  MCF.openSheet('Más secciones', '<div class="list">' + VIEWS.filter(function (v) { return ['inicio', 'movimientos', 'vencimientos', 'presupuesto'].indexOf(v[0]) < 0; }).map(function (v) {
    return '<button class="item" data-view="' + v[0] + '"><span class="ic" style="background:var(--primary-soft);color:var(--primary)">' + icon(v[0]) + '</span><span class="body"><span class="t1">' + v[1] + '</span></span></button>';
  }).join('') + '</div>', '', function (ov) { ov.addEventListener('click', function (e) { var b = e.target.closest('[data-view]'); if (b) MCF.go(b.dataset.view); }); });
};

MCF.reload = function (manual) {
  APP.loading = true;
  var d = dashRange();
  var req = { desde: d[0], hasta: d[1] }; if (APP.budgetPer) req.periodoPresupuesto = APP.budgetPer;
  return MCF.api('getState', req).then(function (r) {
    APP.state = r.state; APP.loading = false; MCF.render(); if (manual) MCF.toast('Datos actualizados desde Google Sheets.', 'ok');
  }, function (err) {

function movRange() {

    case 'mes': return [per + '-01', lastDay(per)];
    case 'mesant': var a = addMonthsP(per, -1); return [a + '-01', lastDay(a)];
    case 'anio': return [t.slice(0, 4) + '-01-01', t.slice(0, 4) + '-12-31'];
    case 'todo': return ['0000-01-01', '9999-12-31'];
    default: return [f.desde || per + '-01', f.hasta || t];
  }
}
function filteredMovs() {
  var f = APP.movFilter, r = movRange(), q = f.q.trim().toLowerCase();
  var list = APP.state.movimientos.filter(function (m) {
    if (m.Fecha < r[0] || m.Fecha > r[1]) return false;
    if (f.tipo && m.Tipo !== f.tipo) return false;
    if (f.cat && m.Categoria !== f.cat) return false;
    if (f.cuenta && m.Cuenta_Origen_ID !== f.cuenta && m.Cuenta_Destino_ID !== f.cuenta && m.Tarjeta_ID !== f.cuenta) return false;
    if (f.medio && m.Medio_Pago !== f.medio) return false;
    if (q && (m.Descripcion + ' ' + m.Persona_Comercio + ' ' + m.Observaciones + ' ' + m.Categoria + ' ' + m.Subcategoria).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var s = f.sort;
  list.sort(function (a, b) {
    if (s === 'importe_desc') return Number(b.Importe) - Number(a.Importe);
    if (s === 'importe_asc') return Number(a.Importe) - Number(b.Importe);
    if (s === 'fecha_asc') return a.Fecha < b.Fecha ? -1 : a.Fecha > b.Fecha ? 1 : 0;
    return a.Fecha < b.Fecha ? 1 : a.Fecha > b.Fecha ? -1 : (a.Creado < b.Creado ? 1 : -1);

function movSign(m) { return ({ INGRESO: 1, DEVOLUCION: 1, GASTO: -1, PAGO_DEUDA: -1, PAGO_TARJETA: -1 })[m.Tipo] || 0; }

  });
  var inp = $('#f-extra'); if (!inp) return;
  function run() {
    var extra = parseNum(inp.value) || 0, mp = APP.state.config.monedaPrincipal;
    var base = APP.state.calc.deudas.filter(function (d) { return d.saldo > 0 && d.Moneda === mp; }).map(function (d) { return { n: d.Acreedor, s: d.saldo, r: (Number(d.tasa) || 0) / 1200, min: d.importeCuota || d.saldo * 0.05 }; });

        ds.forEach(function (d) { if (d.s <= 0) return; var i = d.s * d.r; interest += i; d.s += i; });

        ds.filter(function (d) { return d.s > 0; }).sort(order).forEach(function (d) { var p = Math.min(d.s, avail); d.s -= p; avail -= p; });
        if (avail >= budget - 0.01 && ds.some(function (d) { return d.s > 0.01; })) { month = 600; break; }
      }
      return { m: month, i: interest };
    }
    var av = simulate(function (a, b) { return b.r - a.r; }), sb = simulate(function (a, b) { return a.s - b.s; });
    function fmt(x) { return x.m >= 600 ? 'No se cancela con estos pagos (los intereses superan la cuota).' : x.m + ' meses · intereses totales ' + money(x.i); }

};

        CUENTAS: pick(st.maestros.CUENTAS, ['ID', 'Nombre', 'Moneda', 'Estado', 'Tipo']), TARJETAS: pick(st.maestros.TARJETAS, ['ID', 'Nombre', 'Cuenta_Pago_ID', 'Estado', 'Moneda']),
        AHORROS: pick(st.maestros.AHORROS, ['ID', 'Nombre', 'Moneda']), INVERSIONES: pick(st.maestros.INVERSIONES, ['ID', 'Instrumento', 'Moneda', 'Estado']),
        DEUDAS: pick(st.maestros.DEUDAS, ['ID', 'Acreedor', 'Concepto', 'Moneda', 'Estado']), PAGOS_PROGRAMADOS: pick(st.maestros.PAGOS_PROGRAMADOS, ['ID', 'Concepto']), PRESUPUESTOS: [], TIPOS_CAMBIO: [] } });
    });
  };

  // Vista sin conexión: permite registrar movimientos que quedan PENDIENTES en el teléfono.
  MCF.enterOffline = function () {
    var cat = lsGet(CAT_KEY, null);
    if (!cat) { $('#app').innerHTML = gate('<p>No hay conexión y es la primera vez que abrís la app en este dispositivo.</p><p class="small muted">Conectate a internet e ingresá al menos una vez para poder cargar movimientos sin señal.</p><button class="btn primary block" onclick="location.reload()">Reintentar</button>'); return; }
    APP.offline = true;
    APP.state = { config: cat.config, enums: cat.enums, categorias: cat.categorias, maestros: cat.maestros, movimientos: [], version: '', calc: null };
    if (!$('#view')) MCF.start(true);
    MCF.render();
  };
  var origRender = MCF.render;
  MCF.render = function () {
    if (APP.offline && APP.state && !APP.state.calc) {
      $('#title').textContent = 'Sin conexión';
      var q = MCF.queue.list();
      $('#view').innerHTML = '<div class="alert warn">Estás sin conexión. No se muestran saldos para no mostrar información desactualizada.</div><div class="card empty"><h3>Podés seguir registrando</h3><p>Los movimientos quedan <b>GUARDADOS en el teléfono</b> como <b>PENDIENTES</b> y se envían solos a Google Sheets cuando vuelve internet.</p><button class="btn primary" data-new>+ Registrar movimiento</button></div>' +
        (q.length ? '<div class="section-title">Pendientes (' + q.length + ')</div><button class="btn block" onclick="MCF.showQueue()">Ver pendientes</button>' : '') + '<br><button class="btn block" onclick="location.reload()">Reintentar conexión</button>';
      MCF.renderStatus(); return;
    }
    return origRender();
  };

  function gate(inner) { return '<div class="gate"><div class="card"><div class="sun">' + MCF.SUN + '</div><h1>Mi Centro Financiero</h1>' + inner + '</div></div>'; }

  /* ---------- Inicio de sesión con Google (sólo PWA) ---------- */
  var started = false, refreshTimer = null;
  function parseJwt(t) { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch (e) { return {}; } }
  function onCredential(resp) {
    APP.idToken = resp.credential; var p = parseJwt(resp.credential); APP.user = p.email;
    clearTimeout(refreshTimer);
    var ms = (p.exp * 1000) - Date.now() - 5 * 60 * 1000; // renueva 5 min antes del vencimiento
    if (ms > 0) refreshTimer = setTimeout(function () { try { google.accounts.id.prompt(); } catch (e) {} }, ms);
    var ov = $('#login-ov'); if (ov) ov.remove();
    if (!started) { started = true; MCF.start(); } else { MCF.reload().then(function () { MCF.queue.sync(); }); }
  }
  function loadGis(cb) {
    if (window.google && google.accounts && google.accounts.id) return cb();
    var s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = cb;
    s.onerror = function () { MCF.enterOffline(); };
    document.head.appendChild(s);
  }
  function showLogin(msg) {
    var html = gate('<p class="muted">Ingresá con tu cuenta de Google autorizada.</p>' + (msg ? '<div class="alert warn">' + esc(msg) + '</div>' : '') + '<div id="gbtn" style="display:flex;justify-content:center;margin:16px 0"></div><p class="small muted">Tus datos quedan en tu Google Sheets privado. Esta página no guarda contraseñas.</p>');
    if (!started) { $('#app').innerHTML = html; }
    else { var ov = document.createElement('div'); ov.id = 'login-ov'; ov.className = 'overlay'; ov.style.alignItems = 'center'; ov.innerHTML = html; document.body.appendChild(ov); }
    loadGis(function () {
      google.accounts.id.initialize({ client_id: CFG.CLIENT_ID, callback: onCredential, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true });
      google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', locale: 'es' });
      google.accounts.id.prompt();
    });
  }
  MCF.requireLogin = function (msg) { if (!$('#login-ov')) showLogin(msg || 'Tu sesión venció. Volvé a ingresar.'); };
  MCF.logout = function () { try { google.accounts.id.disableAutoSelect(); } catch (e) {} APP.idToken = null; location.reload(); };

  // La cola no intenta sincronizar sin sesión válida (evita marcar errores falsos).
  var origSync = MCF.queue.sync;
  MCF.queue.sync = function () { if (!IS_GAS && !APP.idToken) return Promise.resolve(0); return origSync(); };

  /* ---------- Service worker (sólo PWA) ---------- */
  function registerSW() {
    if (IS_GAS || !('serviceWorker' in navigator) || !/^https:|^http:\/\/localhost/.test(location.href)) return;
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function ask(w) {
        if (!w || $('.update-bar')) return;
        var bar = document.createElement('div'); bar.className = 'update-bar'; bar.innerHTML = 'Hay una versión nueva de la app. <button>Actualizar</button>';
        bar.querySelector('button').onclick = function () { w.postMessage('SKIP_WAITING'); };
        document.body.appendChild(bar);
      }
      if (reg.waiting) ask(reg.waiting);
      reg.addEventListener('updatefound', function () { var w = reg.installing; w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) ask(w); }); });
    });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloaded) return; reloaded = true; location.reload(); });
  }

  /* ---------- Arranque ---------- */
  var startOrig = MCF.start;
  MCF.start = function (skipLoad) {
    if (skipLoad) { // sólo arma la estructura (modo sin conexión)
      var r = MCF.reload; MCF.reload = function () { return Promise.resolve(); }; startOrig(); MCF.reload = r; return;
    }
    startOrig();
  };
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); MCF._deferredInstall = e; });
  function boot() {
    MCF.applyTheme();
    registerSW();
    if (IS_GAS) { started = true; MCF.start(); return; }
    if (!CFG.CLIENT_ID || /PEGAR/.test(CFG.CLIENT_ID) || !CFG.API_URL || /PEGAR/.test(CFG.API_URL)) {
      $('#app').innerHTML = gate('<div class="alert error">Falta configurar la conexión.</div><p class="small">Completá <b>API_URL</b> y <b>CLIENT_ID</b> en el archivo <code>config.js</code> (ver guía de instalación, paso PWA).</p>');
      return;
    }
    if (!navigator.onLine) { MCF.enterOffline(); return; }
    showLogin();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body>
</html>
